<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear publicación</title>
    <style>
        :root {
            --bg: #eef6f1;
            --bg-alt: #e5efe9;
            --panel: #ffffff;
            --primary: #1f4f3c;
            --primary-alt: #2c6a4e;
            --text: #18372d;
            --line: #dfeae3;
            --error: #b42318;
            --shadow: 0 14px 32px rgba(17, 45, 37, 0.08);
        }

        body[data-theme="dark"] {
            --bg: #151d1b;
            --bg-alt: #1c2624;
            --panel: #1d2725;
            --primary: #7cc18d;
            --primary-alt: #9ad7a5;
            --text: #edf6f0;
            --line: #2d3837;
            --error: #f7a1a1;
            --shadow: 0 14px 32px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
            color: var(--text);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .container {
            max-width: 740px;
            margin: 52px auto;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 30px 28px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 2.2rem;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: transparent;
            color: var(--text);
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea { min-height: 160px; }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        button,
        .theme-toggle {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: var(--primary-alt);
            text-decoration: none;
            font-weight: bold;
        }

        .errorlist {
            color: var(--error);
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" style="margin-bottom: 18px;">Modo oscuro</button>
        <h1>Crear publicación</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="actions">
                <button type="submit">Publicar</button>
                <a href="{% url 'social_home' %}">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const storedTheme = localStorage.getItem('theme');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            toggle.textContent = isDark ? 'Modo claro' : 'Modo oscuro';
        }

        applyTheme(storedTheme || 'light');

        toggle.addEventListener('click', () => {
            const nextTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });
    </script>
</body>
</html>
