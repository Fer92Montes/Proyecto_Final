<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <style>
        /* --- Variables del tema para el registro --- */
        :root {
            --bg: #f6f1ea;
            --panel: #ffffff;
            --primary: #7c4d2e;
            --primary-dark: #5f391f;
            --text: #2c1d12;
            --line: #e7d9ca;
            --error: #b42318;
        }

        body[data-theme="dark"] {
            --bg: #171b1a;
            --panel: #1d2423;
            --primary: #d39b68;
            --primary-dark: #b37a4b;
            --text: #edf4f1;
            --line: #2d3837;
            --error: #f7a1a1;
        }

        /* --- Base general --- */
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, #efe5dc 100%);
            margin: 0;
            color: var(--text);
            transition: background 0.2s ease, color 0.2s ease;
        }

        body[data-theme="dark"] {
            background: linear-gradient(180deg, #171b1a 0%, #1d2423 100%);
        }

        /* --- Formulario de registro --- */
        .container {
            max-width: 620px;
            margin: 80px auto;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 32px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.09);
        }

        h1 { text-align: center; color: var(--primary); }
        form { display: flex; flex-direction: column; gap: 14px; }
        label { font-weight: bold; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-sizing: border-box;
            background: transparent;
            color: var(--text);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .links {
            margin-top: 18px;
            text-align: center;
        }
        a { color: var(--primary); text-decoration: none; }
        .errorlist { color: var(--error); list-style: none; padding: 0; }

        /* --- Botón fijo para cambiar tema --- */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 9999;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.85);
            color: var(--text);
            border-radius: 999px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body data-theme="light">
    <!-- Vista de alta de nuevos usuarios para entrar en la red social. -->
    <div class="container">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>
        <h1>Crear cuenta</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small>{{ field.help_text }}</small>
                    {% endif %}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit">Registrarse</button>
        </form>

        <div class="links">
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
            <p><a href="{% url 'social_home' %}">Volver a la social</a></p>
        </div>
    </div>

    <script>
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const storedTheme = localStorage.getItem('theme');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            toggle.textContent = isDark ? '☀️' : '🌙';
            toggle.setAttribute('aria-label', isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
        }

        applyTheme(storedTheme || 'light');

        toggle.addEventListener('click', () => {
            const nextTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        });
    </script>
</body>
</html>
